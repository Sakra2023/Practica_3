<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Nivel 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #161b22;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #30363d;
            text-align: center;
            width: 320px;
        }
        h1 {
            color: #58a6ff;
            font-size: 1.5rem;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #c9d1d9;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background: #238636;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #2ea043;
        }
        #resultado {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #7ee787;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Calculadora Nivel 3 ⚡</h1>
        <input type="number" id="num1" placeholder="Número 1">
        <input type="number" id="num2" placeholder="Número 2">
        <button onclick="sumar()">Sumar</button>
        <button onclick="restar()">Restar</button>
        <button onclick="multiplicar()">Multiplicar</button>
        <div id="resultado">Resultado: —</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
